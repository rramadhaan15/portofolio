<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark squircle container -->
  <rect width="64" height="64" rx="14" fill="#0D0F12" />
  
  <!-- Subtle neon border & inner glow -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#C3E41D" stroke-width="1.5" stroke-opacity="0.35" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" stroke="#C3E41D" stroke-width="0.75" stroke-opacity="0.12" />

  <!-- Bold Modern Monogram R in Signature Neon Lime -->
  <text 
    x="32" 
    y="44" 
    font-family="'Fira Code', 'Consolas', 'Courier New', monospace" 
    font-size="44" 
    font-weight="900" 
    fill="#C3E41D" 
    text-anchor="middle"
    dominant-baseline="alphabetic"
  >R</text>
</svg>
